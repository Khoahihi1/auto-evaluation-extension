<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header .subtitle {
            font-size: 13px;
            opacity: 0.9;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-card {
            text-align: center;
            padding: 20px;
        }

        .status-indicator {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .status-indicator.on {
            background: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .status-indicator.off {
            background: #ef4444;
        }

        .status-text {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .status-desc {
            font-size: 12px;
            opacity: 0.8;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.5);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            line-height: 1.6;
        }

        .info-box .title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .info-box ol {
            margin-left: 18px;
        }

        .info-box li {
            margin-bottom: 4px;
        }

        .log-card {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .log-card.show {
            max-height: 250px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .log-header .title {
            font-size: 13px;
            font-weight: 600;
        }

        .btn-small {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
        }

        .btn-small:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #logContainer {
            max-height: 180px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
        }

        .log-entry {
            margin-bottom: 6px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry .time {
            opacity: 0.6;
            margin-right: 6px;
        }

        .log-entry.success {
            color: #86efac;
        }

        .log-entry.error {
            color: #fca5a5;
        }

        .log-entry.info {
            color: #e0e7ff;
        }

        .log-empty {
            text-align: center;
            padding: 30px;
            opacity: 0.5;
            font-size: 12px;
        }

        .toggle-log {
            text-align: center;
            margin-top: 10px;
        }

        .toggle-log button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 6px;
        }

        #logContainer::-webkit-scrollbar {
            width: 6px;
        }

        #logContainer::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        #logContainer::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Đánh Giá Tự Động</h1>
            <div class="subtitle">Tiết kiệm thời gian của bạn</div>
        </div>

        <div class="card status-card">
            <div id="statusIndicator" class="status-indicator off">⏸</div>
            <div class="status-text" id="statusText">Đang tắt</div>
            <div class="status-desc" id="statusDesc">Bấm "Bật" để bắt đầu</div>
        </div>

        <div class="btn-group">
            <button id="toggleBtn" class="btn-primary">Bật</button>
            <button id="resetBtn" class="btn-danger">Reset</button>
        </div>

        <div class="card info-box">
            <div class="title">Cách dùng:</div>
            <ol>
                <li>Bấm nút "Bật"</li>
                <li>Vào trang đánh giá</li>
                <li>Để yên và chờ!</li>
            </ol>
        </div>

        <div class="toggle-log">
            <button id="toggleLogBtn" class="btn-small">Xem log chi tiết</button>
        </div>

        <div class="card log-card" id="logCard">
            <div class="log-header">
                <span class="title">Log hoạt động</span>
                <button id="clearLogBtn" class="btn-small">Xóa</button>
            </div>
            <div id="logContainer"></div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
