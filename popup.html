<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header .subtitle {
            font-size: 13px;
            opacity: 0.9;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.4s ease;
        }

        .status-card {
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .status-indicator {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }

        .status-indicator::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            animation: pulse 2s ease-in-out infinite;
            opacity: 0;
        }

        .status-indicator.on {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
            transform: scale(1.05);
        }

        .status-indicator.on::before {
            animation: pulse 2s ease-in-out infinite;
        }

        .status-indicator.off {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .status-indicator.processing {
            animation: rotate 1.5s linear infinite;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .status-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .status-desc {
            font-size: 12px;
            opacity: 0.85;
        }

        /* Progress Section */
        .progress-section {
            margin: 15px 0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .progress-label {
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .stat-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 6px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 10px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            color: white;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.15) 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.25) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-danger {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.4) 0%, rgba(220, 38, 38, 0.4) 100%);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.6) 0%, rgba(220, 38, 38, 0.6) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px;
            font-size: 12px;
            line-height: 1.6;
        }

        .info-box .title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-box ol {
            margin-left: 18px;
        }

        .info-box li {
            margin-bottom: 6px;
            opacity: 0.9;
        }

        .log-card {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }

        .log-card.show {
            max-height: 280px;
            opacity: 1;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .log-header .title {
            font-size: 13px;
            font-weight: 600;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-small:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        #logContainer {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid transparent;
            animation: slideIn 0.3s ease;
        }

        .log-entry .time {
            opacity: 0.6;
            margin-right: 8px;
            font-weight: 600;
        }

        .log-entry.success {
            color: #86efac;
            border-left-color: #10b981;
        }

        .log-entry.error {
            color: #fca5a5;
            border-left-color: #ef4444;
        }

        .log-entry.info {
            color: #e0e7ff;
            border-left-color: #818cf8;
        }

        .log-empty {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.5;
            font-size: 12px;
        }

        .toggle-log {
            text-align: center;
            margin-top: 10px;
        }

        .toggle-log button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 10px 20px;
            font-size: 12px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .toggle-log button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        /* Scrollbar */
        #logContainer::-webkit-scrollbar {
            width: 6px;
        }

        #logContainer::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        #logContainer::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        #logContainer::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0;
                transform: scale(1);
            }

            50% {
                opacity: 0.3;
                transform: scale(1.3);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Đánh Giá Tự Động</h1>
            <div class="subtitle">Tiết kiệm thời gian của bạn</div>
        </div>

        <div class="card status-card">
            <div id="statusIndicator" class="status-indicator off">⏸</div>
            <div class="status-text" id="statusText">Đang tắt</div>
            <div class="status-desc" id="statusDesc">Bấm "Bật" để bắt đầu</div>

            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-label">
                    <span>Tiến độ</span>
                    <span id="progressText">0/0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="statProcessed">0</div>
                        <div class="stat-label">Đã xong</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statSkipped">0</div>
                        <div class="stat-label">Bỏ qua</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statError">0</div>
                        <div class="stat-label">Lỗi</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button id="toggleBtn" class="btn-primary">Bật</button>
            <button id="resetBtn" class="btn-danger">Reset</button>
        </div>

        <div class="card info-box">
            <div class="title">
                <span>💡</span>
                <span>Cách dùng:</span>
            </div>
            <ol>
                <li>Bấm nút "Bật" ở trên</li>
                <li>Vào trang đánh giá giảng viên</li>
                <li>Để yên và chờ extension tự làm!</li>
            </ol>
        </div>

        <div class="toggle-log">
            <button id="toggleLogBtn">📋 Xem log chi tiết</button>
        </div>

        <div class="card log-card" id="logCard">
            <div class="log-header">
                <span class="title">Log hoạt động</span>
                <button id="clearLogBtn" class="btn-small">Xóa</button>
            </div>
            <div id="logContainer"></div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
